<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑笔记 - 放弃修改确认</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 375px; margin: 0 auto;
  font-family: 'Roboto', system-ui, -apple-system, sans-serif;
  background: #FFFBFE; color: #1C1B1E;
}
.header {
  height: 64px; background: #FFFBFE;
  display: flex; align-items: center; padding: 0 4px;
  border-bottom: 1px solid #CAC4D0;
  justify-content: space-between;
}
.header-left { display: flex; align-items: center; }
.btn-back {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; cursor: pointer; border: none; background: transparent;
}
.btn-back svg { width: 24px; height: 24px; fill: #1C1B1E; }
.header-title { font-size: 22px; font-weight: 400; }
.btn-save {
  padding: 8px 16px; border: none; border-radius: 20px;
  background: transparent; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  color: #6750A4; margin-right: 4px;
}
.btn-save:hover { background: rgba(103,80,164,0.08); }
.form { padding: 16px; display: flex; flex-direction: column; height: calc(100vh - 64px); }
.field-title {
  border: 1px solid #79747E; border-radius: 4px;
  padding: 12px 16px; margin-bottom: 12px;
  position: relative;
}
.field-title-label {
  position: absolute; top: -8px; left: 12px;
  background: #FFFBFE; padding: 0 4px;
  font-size: 12px; color: #6750A4;
}
.field-title input {
  width: 100%; border: none; outline: none;
  font-size: 16px; font-weight: 500; font-family: inherit;
  color: #1C1B1E; background: transparent;
}
.field-content {
  border: 1px solid #79747E; border-radius: 4px;
  padding: 12px 16px; flex: 1;
  display: flex; flex-direction: column;
  position: relative; min-height: 280px;
}
.field-content-label {
  position: absolute; top: -8px; left: 12px;
  background: #FFFBFE; padding: 0 4px;
  font-size: 12px; color: #49454F;
}
.field-content textarea {
  width: 100%; flex: 1; border: none; outline: none;
  font-size: 16px; font-family: inherit; resize: none;
  color: #1C1B1E; background: transparent;
  line-height: 24px;
}

/* Dialog overlay */
.overlay {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 375px; height: 100vh;
  background: rgba(0,0,0,0.32); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.dialog {
  background: #FFFBFE; border-radius: 28px;
  padding: 24px; width: 312px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.dialog-title { font-size: 24px; font-weight: 400; margin-bottom: 16px; }
.dialog-text { font-size: 14px; color: #49454F; line-height: 20px; margin-bottom: 24px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn-text {
  padding: 10px 12px; border: none; border-radius: 20px;
  background: transparent; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}
.btn-text.secondary { color: #6750A4; }
.btn-text.secondary:hover { background: rgba(103,80,164,0.08); }
.btn-text.primary { color: #6750A4; font-weight: 600; }
.btn-text.primary:hover { background: rgba(103,80,164,0.08); }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <button class="btn-back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="header-title">编辑笔记</span>
  </div>
  <button class="btn-save">保存</button>
</div>
<div class="form">
  <div class="field-title">
    <span class="field-title-label">标题</span>
    <input type="text" value="新笔记标题">
  </div>
  <div class="field-content">
    <span class="field-content-label">内容</span>
    <textarea>正在编辑的内容，尚未保存…</textarea>
  </div>
</div>

<div class="overlay">
  <div class="dialog">
    <div class="dialog-title">放弃修改？</div>
    <div class="dialog-text">当前修改将不会被保存</div>
    <div class="dialog-actions">
      <button class="btn-text secondary">放弃</button>
      <button class="btn-text primary">保存</button>
    </div>
  </div>
</div>
</body>
</html>
