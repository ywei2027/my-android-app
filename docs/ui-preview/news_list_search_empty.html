<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻列表 — 搜索无结果</title>
<style>
:root {
  --primary: #1A4FBF; --surface: #FEFBFF; --surface-variant: #E7E0EC;
  --on-surface: #1C1B1E; --on-surface-variant: #49454F;
  --outline: #79747E; --outline-variant: #CAC4D0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1C1B1F; --surface-variant: #49454F;
    --on-surface: #E6E1E5; --on-surface-variant: #CAC4D0;
    --primary: #B0C6FF; --outline: #938F99;
  }
}
body { background:#e8e8e8; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Roboto','Noto Sans SC',sans-serif; margin:0; }
.phone { width:375px; height:812px; background:var(--surface); border-radius:44px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); display:flex; flex-direction:column; }
.status-bar { height:44px; background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:12px; color:var(--on-surface); }
.search-bar { margin:8px 16px; height:48px; border:2px solid var(--primary); border-radius:24px; display:flex; align-items:center; padding:0 12px 0 16px; gap:8px; background:var(--surface); }
.search-bar .icon { color:var(--on-surface-variant); font-size:20px; }
.search-bar input { border:none; background:transparent; flex:1; font-size:16px; color:var(--on-surface); outline:none; }
.search-bar .clear { width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--on-surface-variant); font-size:18px; border-radius:18px; border:none; background:transparent; }
.tab-row { display:flex; height:44px; border-bottom:1px solid var(--outline-variant); }
.tab { flex:1; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--on-surface-variant); min-height:48px; position:relative; }
.tab.active { color:var(--primary); font-weight:600; }
.tab.active::after { content:''; position:absolute; bottom:0; left:16px; right:16px; height:3px; background:var(--primary); border-radius:3px 3px 0 0; }
.scroll-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center; }
.empty-icon { font-size:64px; color:var(--outline); margin-bottom:16px; }
.empty-title { font-size:22px; font-weight:600; color:var(--on-surface); margin-bottom:4px; }
.empty-sub { font-size:22px; font-weight:600; color:var(--on-surface); margin-bottom:8px; }
.empty-desc { font-size:14px; color:var(--on-surface-variant); }
.highlight { color:var(--primary); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">09:41 <span>📶 🔋</span></div>
  <div class="search-bar" role="search" aria-label="搜索新闻，当前输入 xyz不存在的词">
    <span class="icon">🔍</span>
    <input value="xyz不存在的词" readonly>
    <button class="clear" aria-label="清除搜索内容">✕</button>
  </div>
  <div class="tab-row">
    <div class="tab active">推荐</div><div class="tab">科技</div><div class="tab">财经</div><div class="tab">体育</div><div class="tab">娱乐</div>
  </div>
  <div class="scroll-area">
    <div class="empty-icon" aria-hidden="true">🔍</div>
    <div class="empty-title">未找到"<span class="highlight">xyz不存在的词</span>"</div>
    <div class="empty-sub">相关新闻</div>
    <div class="empty-desc">换个关键词试试</div>
  </div>
</div>
</body>
</html>
