<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主界面 — 默认态</title>
<style>
/* === M3 Token CSS Variables === */
:root {
  --primary: #6750A4;
  --primary-light: #D0BCFF;
  --surface: #FFFBFE;
  --surface-variant: #E7E0EC;
  --on-surface: #1C1B1F;
  --on-surface-variant: #49454F;
  --error: #B3261E;
  --outline: #79747E;
  --outline-variant: #CAC4D0;
  --ripple: rgba(103, 80, 164, 0.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1C1B1F;
    --surface-variant: #49454F;
    --on-surface: #E6E1E5;
    --on-surface-variant: #CAC4D0;
    --primary: #D0BCFF;
    --primary-light: #381E72;
    --error: #F2B8B5;
    --outline: #938F99;
    --outline-variant: #49454F;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Roboto', 'Noto Sans SC', sans-serif;
}
.phone {
  width: 375px; height: 812px;
  background: var(--surface);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  display: flex; flex-direction: column;
}

/* Status bar */
.status-bar {
  height: 44px; background: var(--surface);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; font-size: 12px; color: var(--on-surface);
}
.status-bar .time { font-weight: 600; }
.status-bar .icons { display: flex; gap: 6px; }

/* TopAppBar */
.top-bar {
  height: 56px; background: var(--surface);
  display: flex; align-items: center; padding: 0 16px;
  border-bottom: 1px solid var(--outline-variant);
}
.top-bar h1 {
  font-size: 22px; font-weight: 500; color: var(--on-surface);
}

/* Content */
.content {
  flex: 1; padding: 24px 16px; color: var(--on-surface-variant);
  font-size: 14px;
}

/* BottomNavigation */
.nav-bar {
  background: var(--surface);
  border-top: 1px solid var(--outline-variant);
}
.nav-items {
  display: flex; justify-content: space-around; padding: 8px 0 4px;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px; color: var(--on-surface-variant);
  min-width: 64px;
}
.nav-item.active { color: var(--primary); }
.nav-icon {
  width: 24px; height: 24px; border-radius: 12px;
  background: var(--on-surface-variant);
}
.nav-item.active .nav-icon { background: var(--primary); }

/* Version tag */
.version-tag {
  text-align: center; padding: 8px 16px 12px;
  font-size: 12px; color: var(--on-surface-variant);
  background: var(--surface);
}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar" aria-hidden="true">
    <span class="time">9:41</span>
    <span class="icons">📶 📡 🔋</span>
  </div>

  <div class="top-bar">
    <h1>我的应用</h1>
  </div>

  <div class="content">
    <p>主界面内容区域</p>
    <p style="color: var(--outline); font-size: 12px;">此处为应用核心功能区域</p>
  </div>

  <div class="nav-bar">
    <div class="nav-items">
      <div class="nav-item active">
        <div class="nav-icon"></div>
        <span>首页</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon"></div>
        <span>发现</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon"></div>
        <span>我的</span>
      </div>
    </div>
    <div class="version-tag" role="text" aria-label="应用版本号 v1.0.0">v1.0.0</div>
  </div>
</div>
</body>
</html>
