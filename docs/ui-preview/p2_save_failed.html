<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P2 笔记编辑器 — 保存失败</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 375px; margin: 0 auto;
  font-family: Roboto, 'Noto Sans SC', sans-serif;
  background: #FFFBFE; color: #1C1B1E; min-height: 812px;
}
.header { height: 64px; display: flex; align-items: center; padding: 0 4px; justify-content: space-between; border-bottom: 1px solid #CAC4D0; background: #FFFBFE; }
.header-left { display: flex; align-items: center; }
.btn-back { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; border: none; background: transparent; }
.btn-back svg { width: 24px; height: 24px; fill: #1C1B1E; }
.header-title { font-size: 22px; font-weight: 400; margin-left: 4px; }
.btn-save { padding: 8px 16px; border: none; border-radius: 20px; background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; color: #6750A4; margin-right: 4px; }

.form { padding: 16px; display: flex; flex-direction: column; height: calc(100vh - 64px); }
.field { border: 1px solid #79747E; border-radius: 4px; padding: 12px 16px; position: relative; margin-bottom: 12px; }
.field-label { position: absolute; top: -8px; left: 12px; background: #FFFBFE; padding: 0 4px; font-size: 12px; color: #6750A4; }
.field input { width: 100%; border: none; outline: none; font-size: 16px; font-weight: 500; font-family: inherit; color: #1C1B1E; background: transparent; }
.field-content { border: 1px solid #79747E; border-radius: 4px; padding: 12px 16px; flex: 1; display: flex; flex-direction: column; position: relative; min-height: 280px; }
.field-content .field-label { color: #49454F; }
.field-content textarea { width: 100%; flex: 1; border: none; outline: none; font-size: 16px; font-family: inherit; resize: none; color: #1C1B1E; background: transparent; line-height: 24px; }

.snackbar { position: fixed; bottom: 24px; left: 12px; right: 12px; width: calc(375px - 24px); background: #313033; border-radius: 4px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 200; box-shadow: 0 6px 10px rgba(0,0,0,0.14); }
.snackbar-text { color: #F4EFF4; font-size: 14px; }
.snackbar-action { color: #D0BCFF; font-weight: 500; cursor: pointer; border: none; background: transparent; font-family: inherit; font-size: 14px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.snackbar-action:hover { background: rgba(208,188,255,0.12); }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <button class="btn-back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <span class="header-title">编辑笔记</span>
  </div>
  <button class="btn-save">保存</button>
</div>
<div class="form">
  <div class="field">
    <span class="field-label">标题</span>
    <input type="text" value="重要会议笔记">
  </div>
  <div class="field-content">
    <span class="field-label">内容</span>
    <textarea>这是需要保存的重要内容，包含了会议讨论的关键决策和后续行动项。</textarea>
  </div>
</div>
<div class="snackbar">
  <span class="snackbar-text">保存失败，请重试</span>
  <button class="snackbar-action">重试</button>
</div>
</body>
</html>
