<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于页面 — 降级态（版本未知）</title>
<style>
  :root {
    --background: #FFFBFC;
    --on-surface: #1C1B1F;
    --on-surface-variant: #49454F;
    --outline-variant: #CAC4D0;
    --primary: #6750A4;
    --primary-container: #EADDFF;
    --on-primary: #FFFFFF;
    --surface-container: #F3EDF7;
    --error: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #1C1B1F;
      --on-surface: #E6E1E5;
      --on-surface-variant: #CAC4D0;
      --outline-variant: #938F99;
      --primary: #D0BCFF;
      --primary-container: #4F378B;
      --on-primary: #381E72;
      --surface-container: #2B2930;
      --error: #F2B8B5;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #E8E6E2;
    font-family: -apple-system, 'Noto Sans SC', 'Roboto', sans-serif;
  }
  .phone {
    width: 375px; height: 812px;
    background: var(--background); color: var(--on-surface);
    border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; }
  .top-bar { display: flex; align-items: center; height: 56px; padding: 0 4px; }
  .top-bar .back { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
  .top-bar .back:hover { background: var(--surface-container); }
  .top-bar .back svg { width: 24px; height: 24px; fill: var(--on-surface); }
  .top-bar .title { font-size: 18px; font-weight: 500; margin-left: 4px; }
  .content { flex: 1; overflow-y: auto; padding: 0 24px; display: flex; flex-direction: column; align-items: center; }
  .app-icon { width: 80px; height: 80px; border-radius: 20px; background: var(--primary-container); display: flex; align-items: center; justify-content: center; margin-top: 32px; }
  .app-icon svg { width: 40px; height: 40px; fill: var(--primary); }
  .app-name { font-size: 24px; font-weight: 400; margin-top: 16px; }
  .app-desc { font-size: 14px; color: var(--on-surface-variant); margin-top: 4px; }
  .divider { width: 100%; height: 1px; background: var(--outline-variant); margin: 16px 0; }
  .version {
    font-size: 14px;
    color: var(--on-surface-variant);
    opacity: 0.6;
    text-align: center;
    padding: 8px 0;
  }
  .info-list { width: 100%; margin-top: 0; }
  .info-item { display: flex; align-items: center; height: 48px; cursor: pointer; border-radius: 12px; padding: 0 12px; }
  .info-item:hover { background: var(--surface-container); }
  .info-item .label { flex: 1; font-size: 16px; }
  .info-item .arrow { width: 24px; height: 24px; fill: var(--on-surface-variant); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>
  <div class="top-bar">
    <div class="back" aria-label="返回" role="button">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    <div class="title">关于</div>
  </div>
  <div class="content">
    <div class="app-icon" aria-label="应用图标">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <div class="app-name">我的应用</div>
    <div class="app-desc">智能笔记助手</div>
    <div class="divider"></div>
    <div class="version" aria-label="当前版本未知，请稍后重试">版本未知</div>
    <div class="divider"></div>
    <div class="info-list">
      <div class="info-item" role="button" aria-label="关于我们"><span class="label">关于我们</span><svg class="arrow" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
      <div class="info-item" role="button" aria-label="用户协议"><span class="label">用户协议</span><svg class="arrow" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
      <div class="info-item" role="button" aria-label="隐私政策"><span class="label">隐私政策</span><svg class="arrow" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
      <div class="info-item" role="button" aria-label="开源许可"><span class="label">开源许可</span><svg class="arrow" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
