<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 空状态</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 375px; margin: 0 auto;
  font-family: Roboto, 'Noto Sans SC', sans-serif;
  background: #FFFBFE; color: #1C1B1E; min-height: 812px;
}
.header { height: 64px; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
.header-title { font-size: 22px; font-weight: 400; }
.header-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
.header-icon svg { width: 24px; height: 24px; fill: #49454F; }

.empty-area { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 64px); padding: 32px; }
.empty-icon { width: 64px; height: 64px; fill: #49454F; margin-bottom: 16px; }
.empty-title { font-size: 24px; font-weight: 400; line-height: 32px; margin-bottom: 8px; }
.empty-desc { font-size: 14px; color: #49454F; line-height: 20px; margin-bottom: 24px; }
.empty-cta { padding: 10px 24px; border: 1px solid #79747E; border-radius: 20px; background: transparent; color: #6750A4; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.empty-cta:hover { background: rgba(103,80,164,0.08); }

.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 16px; background: #EADDFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.14); cursor: pointer; }
.fab svg { width: 24px; height: 24px; fill: #21005D; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">记事本</span>
  <span class="header-icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
</div>
<div class="empty-area">
  <svg class="empty-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  <div class="empty-title">还没有笔记</div>
  <div class="empty-desc">点击右下角按钮创建第一篇笔记</div>
  <button class="empty-cta">创建第一条笔记</button>
</div>
<div class="fab"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
</body>
</html>
