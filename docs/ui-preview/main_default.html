<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主页面 · 版本号显示 — UI 原型</title>
<style>
:root {
  --primary: #6750A4;
  --on-primary: #FFFFFF;
  --surface: #FEFBFF;
  --surface-variant: #E7E0EC;
  --on-surface: #1C1B1E;
  --on-surface-variant: #49454F;
  --outline: #79747E;
  --outline-variant: #CAC4D0;
  --error: #B3261E;
  --ripple: rgba(103, 80, 164, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #D0BCFF;
    --on-primary: #381E72;
    --surface: #1C1B1F;
    --surface-variant: #49454F;
    --on-surface: #E6E1E5;
    --on-surface-variant: #CAC4D0;
    --outline: #938F99;
    --outline-variant: #49454F;
    --error: #F2B8B5;
    --ripple: rgba(208, 188, 255, 0.12);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Roboto', 'Noto Sans SC', -apple-system, sans-serif;
}
.phone {
  width: 375px; height: 812px;
  background: var(--surface);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  display: flex; flex-direction: column;
}
.status-bar {
  height: 44px; background: var(--surface);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-size: 12px; color: var(--on-surface);
  font-weight: 600;
}
.status-bar .time { flex: 1; text-align: center; }
.content {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
  position: relative;
}
.logo-area {
  width: 80px; height: 80px;
  border-radius: 20px;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 32px;
}
.logo-area svg { width: 40px; height: 40px; }
.title {
  font-size: 28px; font-weight: 400; color: var(--on-surface);
  margin-bottom: 12px; letter-spacing: -0.5px;
}
.subtitle {
  font-size: 14px; color: var(--on-surface-variant);
  margin-bottom: 32px;
}
.input-field {
  width: 100%; height: 56px;
  border: 1px solid var(--outline);
  border-radius: 4px 4px 0 0;
  padding: 0 16px;
  font-size: 16px; color: var(--on-surface);
  background: var(--surface);
  display: flex; align-items: center;
  margin-bottom: 12px;
  transition: border 0.15s;
}
.input-field:focus-within {
  border-bottom: 2px solid var(--primary);
  border-color: var(--primary);
}
.input-field .placeholder {
  color: var(--on-surface-variant); font-size: 16px;
}
.btn-primary {
  width: 100%; height: 48px;
  background: var(--primary); color: var(--on-primary);
  border: none; border-radius: 100px;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--ripple); opacity: 0.92; }
.version-tag {
  position: absolute; bottom: 8px;
  left: 0; right: 0; text-align: center;
  font-size: 12px; color: var(--on-surface-variant);
  padding-bottom: 34px;
}
.nav-bar {
  height: 34px; background: var(--surface);
  display: flex; align-items: center; justify-content: center;
}
.nav-bar .indicator {
  width: 134px; height: 5px;
  background: var(--on-surface);
  border-radius: 100px;
}
.badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--primary); color: var(--on-primary);
  font-size: 10px; padding: 4px 8px; border-radius: 8px;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span class="time">&#9679;&#9679;&#9679;&#9679;</span>
    <span>🔋</span>
  </div>
  <div class="content">
    <div class="badge" aria-label="Release 构建">Release</div>
    <div class="logo-area">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <div class="title">登录</div>
    <div class="subtitle">输入手机号获取验证码</div>
    <div class="input-field" role="textbox" aria-label="手机号输入框" tabindex="0">
      <span class="placeholder">手机号</span>
    </div>
    <button class="btn-primary" aria-label="获取验证码">获取验证码</button>
    <div class="version-tag" aria-label="应用版本号 v1.0.0">v1.0.0(42)</div>
  </div>
  <div class="nav-bar"><div class="indicator"></div></div>
</div>
</body>
</html>
