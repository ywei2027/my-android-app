<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash 启动页 — 版本号显示预览</title>
<style>
:root {
  --primary: #1A73E8;
  --surface: #FEFBFF;
  --on-surface: #1C1B1F;
  --white: #FFFFFF;
  --ripple: rgba(255,255,255,0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #8AB4F8;
    --surface: #1C1B1F;
    --on-surface: #E6E1E5;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Roboto', 'Noto Sans SC', -apple-system, sans-serif;
}
.phone {
  width: 375px; height: 812px;
  background: var(--primary);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  position: relative;
  display: flex; flex-direction: column;
}
.status-bar {
  height: 44px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 24px;
  color: var(--white);
  font-size: 12px;
  font-weight: 500;
}
.content {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 0;
}
.logo-icon {
  font-size: 72px;
  line-height: 1;
  animation: scaleIn 0.6s cubic-bezier(0.2,0.9,0.3,1) 0.1s both;
}
.app-name {
  color: var(--white);
  font-size: 28px;
  font-weight: 700;
  margin-top: 16px;
  animation: scaleIn 0.6s cubic-bezier(0.2,0.9,0.3,1) 0.15s both;
}
.app-tagline {
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  font-weight: 400;
  margin-top: 8px;
  animation: scaleIn 0.6s cubic-bezier(0.2,0.9,0.3,1) 0.2s both;
}
.version-tag {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.4px;
  padding-bottom: 40px; /* 32dp + ~8dp navBar */
  animation: fadeIn 0.3s ease 0.3s both;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  padding-left: 16px;
  padding-right: 16px;
}
.nav-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px;
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
}
@keyframes scaleIn {
  from { transform: scale(0.3); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.badge {
  position: absolute; top: 12px; left: 12px;
  padding: 4px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600;
  color: var(--white); background: rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="content">
    <div class="logo-icon" aria-hidden="true">📰</div>
    <div class="app-name">新闻</div>
    <div class="app-tagline">热点资讯 一键掌握</div>
  </div>

  <div class="version-tag" role="text" aria-label="应用版本号 v1.0.0 构建 1 调试版本">
    v1.0.0(1)debug
  </div>

  <div class="nav-bar" aria-hidden="true"></div>

  <div class="badge">Debug</div>
</div>

</body>
</html>
