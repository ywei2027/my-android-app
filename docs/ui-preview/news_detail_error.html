<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻详情 — 错误态</title>
<style>
:root {
  --primary: #1A4FBF; --surface: #FEFBFF;
  --on-surface: #1C1B1E; --on-surface-variant: #49454F;
  --error: #B81C1C; --outline: #79747E; --outline-variant: #CAC4D0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1C1B1F; --on-surface: #E6E1E5; --on-surface-variant: #CAC4D0;
    --primary: #B0C6FF; --error: #FFB4AB; --outline: #938F99;
  }
}
body { background:#e8e8e8; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Roboto','Noto Sans SC',sans-serif; margin:0; }
.phone { width:375px; height:812px; background:var(--surface); border-radius:44px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); display:flex; flex-direction:column; }
.status-bar { height:44px; background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:12px; color:var(--on-surface); flex-shrink:0; }
.top-bar { height:48px; display:flex; align-items:center; padding:0 8px; border-bottom:1px solid var(--outline-variant); flex-shrink:0; }
.back-btn { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; color:var(--on-surface); }
.scroll-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center; }
.error-icon { font-size:64px; color:var(--outline); margin-bottom:16px; }
.error-title { font-size:22px; font-weight:600; color:var(--on-surface); margin-bottom:8px; }
.error-desc { font-size:14px; color:var(--on-surface-variant); margin-bottom:24px; }
.btn-row { display:flex; gap:12px; }
.btn-primary { background:var(--primary); color:#fff; border:none; padding:10px 24px; border-radius:20px; font-size:14px; font-weight:500; cursor:pointer; min-height:48px; }
.btn-text { background:transparent; color:var(--primary); border:none; padding:10px 16px; font-size:14px; cursor:pointer; min-height:48px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">09:41 <span>📶 🔋</span></div>
  <div class="top-bar">
    <div class="back-btn" aria-label="返回新闻列表" tabindex="0">←</div>
  </div>
  <div class="scroll-area">
    <div class="error-icon" aria-hidden="true">📄</div>
    <div class="error-title">文章已被删除或不存在</div>
    <div class="error-desc">该文章可能已被移除，或链接已失效</div>
    <div class="btn-row">
      <button class="btn-primary" aria-label="重试加载">重试</button>
      <button class="btn-text" aria-label="返回列表">返回列表</button>
    </div>
  </div>
</div>
</body>
</html>
