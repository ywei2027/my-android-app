<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻详情 — 成功态</title>
<style>
:root {
  --primary: #1A4FBF; --primary-container: #D8E2FF;
  --surface: #FEFBFF; --surface-variant: #E7E0EC;
  --on-surface: #1C1B1E; --on-surface-variant: #49454F;
  --outline: #79747E; --outline-variant: #CAC4D0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1C1B1F; --surface-variant: #49454F;
    --on-surface: #E6E1E5; --on-surface-variant: #CAC4D0;
    --primary: #B0C6FF; --primary-container: #00315F;
    --outline: #938F99; --outline-variant: #49454F;
  }
}
body { background:#e8e8e8; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Roboto','Noto Sans SC',sans-serif; margin:0; }
.phone { width:375px; height:812px; background:var(--surface); border-radius:44px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); display:flex; flex-direction:column; }
.status-bar { height:44px; background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:12px; color:var(--on-surface); flex-shrink:0; }
.top-bar { height:48px; display:flex; align-items:center; padding:0 8px; border-bottom:1px solid var(--outline-variant); flex-shrink:0; }
.back-btn { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; color:var(--on-surface); border-radius:24px; transition:background 0.15s; }
.back-btn:hover { background:rgba(0,0,0,0.05); }
.header-img { width:100%; height:200px; background:linear-gradient(135deg, #667eea, #764ba2); display:flex; align-items:center; justify-content:center; font-size:48px; flex-shrink:0; }
.scroll-area { flex:1; overflow-y:auto; padding:16px; }
.article-title { font-size:22px; font-weight:700; color:var(--on-surface); line-height:30px; margin-bottom:12px; }
.meta-row { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--on-surface-variant); margin-bottom:16px; }
.body-text { font-size:16px; line-height:26px; color:var(--on-surface); margin-bottom:24px; }
.read-more-btn { display:block; width:100%; padding:12px; background:var(--primary-container); color:var(--primary); border:none; border-radius:20px; font-size:14px; font-weight:500; cursor:pointer; min-height:48px; text-align:center; transition:opacity 0.15s; }
.read-more-btn:hover { opacity:0.88; }
.footer { font-size:11px; color:var(--on-surface-variant); text-align:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--outline-variant); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">09:41 <span>📶 🔋</span></div>
  <div class="top-bar">
    <div class="back-btn" role="button" aria-label="返回新闻列表" tabindex="0">←</div>
  </div>
  <div class="header-img" aria-label="AI技术突破 的配图">🤖</div>
  <div class="scroll-area">
    <div class="article-title">AI技术突破：全新多模态模型发布，性能超越前代</div>
    <div class="meta-row">
      <span>科技日报</span>
      <span>·</span>
      <span>2026-06-04 10:30</span>
    </div>
    <div class="body-text">
      近日，OpenAI发布了全新的多模态AI模型GPT-5，该模型在图像理解、代码生成和复杂推理任务上全面超越前代产品。据官方数据，GPT-5在MMLU基准测试中达到92.7%的准确率，较GPT-4提升了8个百分点。<br><br>
      新模型支持同时处理文本、图像、音频和视频输入，并能生成高质量的多模态输出。业内专家认为，这标志着AI技术进入了一个全新的发展阶段。
    </div>
    <button class="read-more-btn" aria-label="阅读原文，将跳转到外部浏览器">阅读原文 (NewsAPI)</button>
    <div class="footer">来源: NewsAPI · 内容仅供参考</div>
  </div>
</div>
</body>
</html>
