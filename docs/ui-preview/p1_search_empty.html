<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 搜索无结果</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 375px; margin: 0 auto;
  font-family: Roboto, 'Noto Sans SC', sans-serif;
  background: #FFFBFE; color: #1C1B1E; min-height: 812px;
}
.search-bar { height: 64px; display: flex; align-items: center; padding: 0 8px; border-bottom: 2px solid #6750A4; gap: 4px; }
.btn-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; border: none; background: transparent; flex-shrink: 0; }
.btn-icon svg { width: 24px; height: 24px; fill: #49454F; }
.search-wrap { flex: 1; display: flex; align-items: center; gap: 8px; }
.search-wrap > svg { width: 24px; height: 24px; fill: #49454F; flex-shrink: 0; }
.search-input { flex: 1; border: none; outline: none; font-size: 16px; font-family: inherit; background: transparent; color: #1C1B1E; }
.search-input::placeholder { color: #49454F; }

.empty-area { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 64px); padding: 32px; }
.empty-icon svg { width: 64px; height: 64px; fill: #49454F; margin-bottom: 16px; }
.empty-title { font-size: 24px; font-weight: 400; line-height: 32px; margin-bottom: 8px; text-align: center; }
.empty-desc { font-size: 14px; color: #49454F; line-height: 20px; margin-bottom: 24px; }
.clear-btn { padding: 10px 24px; border: none; border-radius: 20px; background: transparent; color: #6750A4; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.clear-btn:hover { background: rgba(103,80,164,0.08); }

.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 16px; background: #EADDFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.14); cursor: pointer; }
.fab svg { width: 24px; height: 24px; fill: #21005D; }
</style>
</head>
<body>
<div class="search-bar">
  <button class="btn-icon"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input class="search-input" value="不存在的关键词" placeholder="搜索笔记…">
  </div>
  <button class="btn-icon"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
</div>
<div class="empty-area">
  <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/><line x1="5" y1="5" x2="19" y2="19" stroke="#49454F" stroke-width="2"/></svg></div>
  <div class="empty-title">没有找到匹配的笔记</div>
  <div class="empty-desc">换个关键词试试</div>
  <button class="clear-btn">清除搜索</button>
</div>
<div class="fab"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
</body>
</html>
