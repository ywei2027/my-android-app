<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 搜索无结果</title>
<style>
:root {
  --primary: #1A4FBF; --primaryContainer: #DAE2FF; --onPrimaryContainer: #001849;
  --surface: #FEFBFF; --onSurface: #1C1B1E; --onSurfaceVariant: #49454F;
  --outline: #79747E; --background: #FEFBFF; --surfaceVariant: #E7E0EC;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #B0C6FF; --primaryContainer: #0040A5; --onPrimaryContainer: #DAE2FF;
    --surface: #1C1B1F; --onSurface: #E6E1E5; --onSurfaceVariant: #CAC4D0;
    --outline: #938F99; --background: #1C1B1F; --surfaceVariant: #49454F;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; margin:0 auto; font-family:Roboto,'Noto Sans SC',sans-serif; background:var(--background); color:var(--onSurface); min-height:812px; display:flex; flex-direction:column; }
.status-bar { height:44px; display:flex; align-items:center; justify-content:flex-end; padding:0 16px; font-size:14px; font-weight:600; }
.top-bar { height:64px; display:flex; align-items:center; padding:0 4px 0 16px; }
.search-bar { flex:1; height:56px; border-radius:28px; background:var(--surface); border:2px solid var(--primary); display:flex; align-items:center; padding:0 4px 0 8px; }
.search-bar svg { width:24px; height:24px; color:var(--onSurfaceVariant); margin:0 8px; flex-shrink:0; }
.search-bar input { flex:1; border:none; background:transparent; font-size:16px; color:var(--onSurface); outline:none; }
.clear-btn { width:36px; height:36px; border-radius:18px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--onSurfaceVariant); margin-right:4px; }
.clear-btn svg { width:20px; height:20px; }
.empty-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 48px; padding-bottom:100px; }
.empty-icon { width:64px; height:64px; margin-bottom:16px; color:var(--outline); }
.empty-title { font-size:24px; font-weight:400; line-height:32px; color:var(--onSurface); text-align:center; margin-bottom:8px; }
.empty-desc { font-size:14px; line-height:20px; color:var(--onSurfaceVariant); text-align:center; margin-bottom:24px; }
.clear-search-btn { padding:10px 24px; border-radius:20px; border:1px solid var(--outline); background:transparent; color:var(--primary); font-size:14px; font-weight:500; cursor:pointer; }
.keyword { color:var(--onSurface); font-weight:500; }
</style>
</head>
<body>
<div class="status-bar">9:41</div>
<div class="top-bar">
  <div class="search-bar" role="search" aria-label="搜索笔记">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="search" value="Flutter" aria-label="搜索笔记">
    <button class="clear-btn" aria-label="清除搜索内容"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>
</div>
<div class="empty-area">
  <svg class="empty-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 12h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 12 5 9.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><circle cx="18" cy="19" r="4" fill="var(--outline)" opacity="0.3"/><text x="18" y="20.5" text-anchor="middle" font-size="4" font-weight="700" fill="var(--outline)">?</text></svg>
  <div class="empty-title">没有找到包含"<span class="keyword">Flutter</span>"的笔记</div>
  <div class="empty-desc">换个关键词试试</div>
  <button class="clear-search-btn">清除搜索</button>
</div>
</body>
</html>
