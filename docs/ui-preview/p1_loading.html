<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 加载中</title>
<style>
:root {
  --primary: #1A4FBF; --primaryContainer: #DAE2FF; --onPrimaryContainer: #001849;
  --surface: #FEFBFF; --onSurface: #1C1B1E; --onSurfaceVariant: #49454F;
  --outline: #79747E; --background: #FEFBFF; --surfaceVariant: #E7E0EC;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #B0C6FF; --primaryContainer: #0040A5; --onPrimaryContainer: #DAE2FF;
    --surface: #1C1B1F; --onSurface: #E6E1E5; --onSurfaceVariant: #CAC4D0;
    --outline: #938F99; --background: #1C1B1F; --surfaceVariant: #49454F;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; margin:0 auto; font-family:Roboto,'Noto Sans SC',sans-serif; background:var(--background); color:var(--onSurface); min-height:812px; }
.status-bar { height:44px; display:flex; align-items:center; justify-content:flex-end; padding:0 16px; font-size:14px; font-weight:600; }
.top-bar { height:64px; display:flex; align-items:center; padding:0 4px 0 16px; }
.search-bar { flex:1; height:56px; border-radius:28px; background:var(--surfaceVariant); display:flex; align-items:center; padding:0 8px; opacity:0.5; }
.search-bar svg { width:24px; height:24px; color:var(--onSurfaceVariant); margin:0 8px; flex-shrink:0; }
.search-bar input { flex:1; border:none; background:transparent; font-size:16px; outline:none; }
.content { padding:0 16px; display:flex; flex-direction:column; align-items:center; padding-top:120px; }
.spinner { width:48px; height:48px; border:4px solid var(--surfaceVariant); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:24px; }
.loading-text { font-size:14px; color:var(--onSurfaceVariant); }
.skeleton-card { width:100%; height:88px; border-radius:12px; background:linear-gradient(90deg, var(--surfaceVariant) 25%, var(--surface) 50%, var(--surfaceVariant) 75%); background-size:200% 100%; animation:shimmer 1.5s ease-in-out infinite; margin-bottom:12px; }
.skeleton-card:nth-child(2) { width:92%; }
.skeleton-card:nth-child(3) { width:85%; }
.skeleton-card:nth-child(4) { width:95%; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
</style>
</head>
<body>
<div class="status-bar">9:41</div>
<div class="top-bar">
  <div class="search-bar" role="search">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="search" placeholder="搜索笔记" disabled>
  </div>
</div>
<div class="content">
  <div class="spinner" role="progressbar" aria-label="加载中"></div>
  <div class="loading-text">加载笔记中...</div>
  <div style="width:100%; margin-top:32px;">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>
</div>
</body>
</html>
