<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 加载中</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 375px; margin: 0 auto;
  font-family: Roboto, 'Noto Sans SC', sans-serif;
  background: #FFFBFE; color: #1C1B1E; min-height: 812px;
}
.header { height: 64px; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
.header-title { font-size: 22px; font-weight: 400; }
.header-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; opacity: 0.5; }
.header-icon svg { width: 24px; height: 24px; fill: #49454F; }

@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0); } }
.shimmer-card {
  height: 88px; border-radius: 12px; margin: 0 16px 12px;
  background: linear-gradient(90deg, #E7E0EC 25%, #F4F0F8 50%, #E7E0EC 75%);
  background-size: 200px 100%; animation: shimmer 1.5s ease-in-out infinite;
}

.spinner-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 48px; }
.spinner { width: 48px; height: 48px; border: 4px solid #E7E0EC; border-top-color: #6750A4; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #49454F; padding-top: 16px; }

.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 16px; background: #EADDFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.14); }
.fab svg { width: 24px; height: 24px; fill: #21005D; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">记事本</span>
  <span class="header-icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
</div>
<div class="spinner-wrap"><div class="spinner"></div><div class="loading-text">加载笔记中…</div></div>
<div style="padding-top: 32px;">
  <div class="shimmer-card"></div>
  <div class="shimmer-card"></div>
  <div class="shimmer-card"></div>
</div>
<div class="fab"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
</body>
</html>
