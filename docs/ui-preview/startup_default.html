<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启动页面 — 默认态</title>
<style>
:root {
  --primary: #1A4FBF;
  --primary-light: #B0C6FF;
  --surface: #FEFBFF;
  --surface-variant: #E7E0EC;
  --on-surface: #1C1B1E;
  --on-surface-variant: #49454F;
  --on-primary: #FFFFFF;
  --error: #B81C1C;
  --outline: #79747E;
  --outline-variant: #CAC4D0;
  --ripple: rgba(26, 79, 191, 0.08);
  --navbar-bg: #F3EDF7;
  --statusbar-bg: #F3EDF7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1C1B1F;
    --surface-variant: #49454F;
    --on-surface: #E6E1E5;
    --on-surface-variant: #CAC4D0;
    --primary: #B0C6FF;
    --primary-light: #1A4FBF;
    --on-primary: #001D36;
    --error: #FFB4AB;
    --outline: #938F99;
    --outline-variant: #49454F;
    --ripple: rgba(176, 198, 255, 0.08);
    --navbar-bg: #1C1B1F;
    --statusbar-bg: #1C1B1F;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Roboto', 'Noto Sans SC', -apple-system, sans-serif;
}
.phone {
  width: 375px; height: 812px;
  background: var(--surface);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  position: relative;
  display: flex; flex-direction: column;
}

/* Status Bar */
.status-bar {
  height: 44px; background: var(--statusbar-bg);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-size: 12px; color: var(--on-surface);
  font-weight: 600;
  flex-shrink: 0;
}
.status-bar .time { font-size: 14px; }
.status-bar .icons { display: flex; gap: 4px; font-size: 11px; }

/* Content Area */
.content {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.content h1 {
  font-size: 24px; font-weight: 400;
  color: var(--on-surface);
  margin-bottom: 24px;
}

/* Input Field */
.input-field {
  width: 100%; height: 56px;
  border: 1px solid var(--outline);
  border-radius: 4px 4px 0 0;
  padding: 0 12px;
  font-size: 16px; color: var(--on-surface);
  background: var(--surface);
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}
.input-field:focus {
  border-color: var(--primary);
  border-width: 2px;
}
.input-field::placeholder {
  color: var(--on-surface-variant);
  font-size: 16px;
}

/* Button */
.btn {
  width: 100%; height: 48px;
  background: var(--primary);
  color: var(--on-primary);
  border: none; border-radius: 100px;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.btn:hover { opacity: 0.9; }

/* Version Tag */
.version-tag {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--on-surface-variant);
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Navigation Bar */
.nav-bar {
  height: 34px; background: var(--navbar-bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-bar .handle {
  width: 134px; height: 5px;
  background: var(--on-surface);
  border-radius: 100px;
  opacity: 0.3;
}

/* Debug badge */
.debug-badge {
  display: inline-block;
  background: var(--primary);
  color: var(--on-primary);
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 4px;
}
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <span>●●●●○</span>
      <span>WiFi</span>
      <span>🔋</span>
    </span>
  </div>

  <!-- Content -->
  <div class="content">
    <h1>登录</h1>

    <!-- Phone Input -->
    <label for="phone-input" style="font-size:12px;color:var(--on-surface-variant);margin-bottom:4px;">手机号</label>
    <input id="phone-input" class="input-field" type="tel" placeholder="请输入手机号" aria-label="手机号输入框">

    <!-- Submit Button -->
    <button class="btn" aria-label="获取验证码">获取验证码</button>

    <!-- Version Tag (visible in default state) -->
    <div class="version-tag" role="text" aria-label="应用版本号 v1.0 debug 构建">
      v1.0(1)<span class="debug-badge">debug</span>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <div class="handle"></div>
  </div>
</div>
</body>
</html>
