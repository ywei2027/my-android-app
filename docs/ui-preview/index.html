<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-android-app — UI 原型预览</title>
<style>
:root {
  --primary: #1A73E8;
  --primary-light: #B0C6FF;
  --surface: #FEFBFF;
  --surface-variant: #E7E0EC;
  --on-surface: #1C1B1E;
  --on-surface-variant: #49454F;
  --on-primary: #FFFFFF;
  --error: #B81C1C;
  --outline: #79747E;
  --outline-variant: #CAC4D0;
  --ripple: rgba(26, 115, 232, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1C1B1F;
    --surface-variant: #49454F;
    --on-surface: #E6E1E5;
    --on-surface-variant: #CAC4D0;
    --primary: #8AB4F8;
    --primary-light: #1A4FBF;
    --on-primary: #003A75;
    --error: #FFB4AB;
    --outline: #938F99;
    --outline-variant: #49454F;
    --ripple: rgba(138, 180, 248, 0.08);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Roboto', 'Noto Sans SC', sans-serif;
}
.container { max-width: 420px; padding: 24px; text-align: center; }
h1 { font-size: 24px; color: var(--on-surface); margin-bottom: 4px; }
.subtitle { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 24px; }
.page-card {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  text-align: left;
}
.page-card h2 { font-size: 18px; color: var(--on-surface); margin-bottom: 4px; }
.page-card p { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 12px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  text-decoration: none;
  font-size: 13px;
  transition: background 0.15s;
}
.link-primary { background: var(--primary); color: var(--on-primary); }
.link-primary:hover { opacity: 0.9; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-left: 8px;
  background: var(--primary);
  color: var(--on-primary);
  opacity: 0.7;
}
</style>
</head>
<body>
<div class="container">
  <h1>my-android-app — UI 原型预览</h1>
  <p class="subtitle">v0.1-draft — 2026-06-07</p>

  <div class="page-card">
    <h2>用户登录 <span class="badge">新</span></h2>
    <p>LoginScreen — 邮箱+密码登录，M3 风格，含完整状态覆盖（Idle/Editing/Loading/Error/Timeout）</p>
    <div class="links">
      <a href="login.html" class="link-primary">登录页原型（可交互）</a>
    </div>
  </div>

  <div class="page-card">
    <h2>启动页面版本号</h2>
    <p>MainActivity → LoginScreen + VersionTag 叠加，键盘弹出时版本号自动隐藏</p>
    <div class="links">
      <a href="startup_default.html" class="link-primary">默认态（版本号可见）</a>
    </div>
  </div>
</div>
</body>
</html>
