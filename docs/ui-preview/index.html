<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻App — 原型导航</title>
<style>
:root {
  --primary: #1A4FBF;
  --primary-container: #D8E2FF;
  --surface: #FEFBFF;
  --surface-variant: #E7E0EC;
  --on-surface: #1C1B1E;
  --on-surface-variant: #49454F;
  --error: #B81C1C;
  --outline: #79747E;
}
body {
  background: #e8e8e8;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Roboto', 'Noto Sans SC', sans-serif;
}
.container {
  background: var(--surface);
  border-radius: 44px;
  width: 375px; min-height: 812px;
  padding: 32px 24px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  box-sizing: border-box;
}
h1 { font-size: 24px; font-weight: 700; color: var(--on-surface); margin: 0 0 8px 0; }
.subtitle { font-size: 14px; color: var(--on-surface-variant); margin: 0 0 24px 0; }
.section { margin-bottom: 24px; }
.section h2 { font-size: 16px; color: var(--on-surface); margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.link { display: inline-block; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 500; transition: background 0.15s; }
.link-primary { background: var(--primary); color: #fff; }
.link-primary:hover { opacity: 0.88; }
.link-second { background: var(--surface-variant); color: var(--on-surface-variant); }
.link-second:hover { background: #d8d2de; }
.link-outline { border: 1px solid var(--outline); color: var(--primary); }
</style>
</head>
<body>
<div class="container">
  <h1>📰 小型新闻App</h1>
  <p class="subtitle">UI 原型预览 — v0.1-draft</p>

  <div class="section">
    <h2>📱 新闻列表页</h2>
    <div class="links">
      <a href="news_list_default.html" class="link-primary">默认态（有数据）</a>
      <a href="news_list_loading.html" class="link-second">首次加载态</a>
      <a href="news_list_error.html" class="link-second">错误态</a>
      <a href="news_list_empty.html" class="link-second">空分类态</a>
    </div>
  </div>

  <div class="section">
    <h2>📄 新闻详情页</h2>
    <div class="links">
      <a href="news_detail_success.html" class="link-primary">成功态</a>
      <a href="news_detail_loading.html" class="link-second">加载态</a>
      <a href="news_detail_error.html" class="link-second">错误态</a>
    </div>
  </div>

  <div class="section">
    <h2>🔍 搜索态</h2>
    <div class="links">
      <a href="news_list_search_empty.html" class="link-second">搜索无结果</a>
    </div>
  </div>

  <p style="font-size:12px; color:var(--outline); margin-top:24px; text-align:center;">
    Android 新闻App · Material3 设计 · 375×812 iPhone X 视口
  </p>
</div>
</body>
</html>
