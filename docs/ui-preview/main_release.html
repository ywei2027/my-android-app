<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>版本号显示 — Release 构建</title>
  <style>
    :root {
      --primary: #1A4FBF;
      --surface: #FEFBFF;
      --surface-variant: #E7E0EC;
      --on-surface: #1C1B1E;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --outline-variant: #CAC4D0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --surface-variant: #49454F;
        --on-surface: #E6E1E5;
        --on-surface-variant: #CAC4D0;
        --primary: #B0C6FF;
        --outline: #938F99;
        --outline-variant: #49454F;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #e8e8e8;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      font-family: 'Roboto', 'Noto Sans SC', sans-serif;
    }
    .phone {
      width: 375px; height: 812px;
      background: var(--surface);
      border-radius: 44px; overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      display: flex; flex-direction: column;
    }
    .status-bar {
      height: 44px; background: transparent;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 24px; font-size: 12px; color: var(--on-surface-variant);
    }
    .content {
      flex: 1; display: flex; flex-direction: column;
      padding: 24px 16px;
    }
    .content h2 {
      font-size: 24px; color: var(--on-surface);
      margin-bottom: 16px;
    }
    .text-field {
      border: 1px solid var(--outline);
      border-radius: 8px; padding: 14px 12px;
      font-size: 16px; color: var(--on-surface);
      margin-bottom: 16px;
    }
    .text-field::placeholder { color: var(--on-surface-variant); opacity: 0.6; }
    .btn {
      background: var(--primary); color: white;
      border: none; border-radius: 20px;
      padding: 12px 24px; font-size: 14px;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .version-tag {
      padding: 8px 16px 16px;
      text-align: center;
      font-size: 12px;
      color: var(--on-surface-variant);
      border-top: 1px solid var(--surface-variant);
    }
    .nav-bar { height: 28px; background: transparent; }
  </style>
</head>
<body>
<div class="phone">
  <div class="status-bar">9:41</div>
  <div class="content">
    <h2>登录</h2>
    <div class="text-field" contenteditable="false">手机号</div>
    <button class="btn">获取验证码</button>
  </div>
  <div class="version-tag" aria-label="应用版本号 v1.0">v1.0</div>
  <div class="nav-bar"></div>
</div>
</body>
</html>
