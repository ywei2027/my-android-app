<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 搜索过滤</title>
<style>
:root {
  --primary: #1A4FBF; --onPrimaryContainer: #001849; --primaryContainer: #DAE2FF;
  --surface: #FEFBFF; --onSurface: #1C1B1E; --onSurfaceVariant: #49454F;
  --outline: #79747E; --outlineVariant: #CAC4D0;
  --background: #FEFBFF; --surfaceVariant: #E7E0EC;
  --highlight-bg: rgba(26,79,191,0.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #B0C6FF; --onPrimaryContainer: #DAE2FF; --primaryContainer: #0040A5;
    --surface: #1C1B1F; --onSurface: #E6E1E5; --onSurfaceVariant: #CAC4D0;
    --outline: #938F99; --outlineVariant: #49454F;
    --background: #1C1B1F; --surfaceVariant: #49454F;
    --highlight-bg: rgba(176,198,255,0.18);
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; margin:0 auto; font-family:Roboto,'Noto Sans SC',sans-serif; background:var(--background); color:var(--onSurface); min-height:812px; }
.status-bar { height:44px; display:flex; align-items:center; justify-content:flex-end; padding:0 16px; font-size:14px; font-weight:600; }
.top-bar { height:64px; display:flex; align-items:center; padding:0 4px 0 16px; }
.search-bar { flex:1; height:56px; border-radius:28px; background:var(--surface); border:2px solid var(--primary); display:flex; align-items:center; padding:0 4px 0 8px; }
.search-bar svg { width:24px; height:24px; color:var(--onSurfaceVariant); margin:0 8px; flex-shrink:0; }
.search-bar input { flex:1; border:none; background:transparent; font-size:16px; color:var(--onSurface); outline:none; }
.clear-btn { width:36px; height:36px; border-radius:18px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--onSurfaceVariant); margin-right:4px; }
.clear-btn svg { width:20px; height:20px; }
.result-count { font-size:12px; font-weight:500; line-height:16px; color:var(--onSurfaceVariant); padding:12px 16px 4px; }
.content { padding:0 16px; }
.card { border-radius:12px; background:var(--surface); border:1px solid var(--outlineVariant); padding:16px; margin-bottom:12px; cursor:pointer; }
.card-title { font-size:16px; font-weight:500; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-summary { font-size:14px; line-height:20px; color:var(--onSurfaceVariant); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-time { font-size:11px; line-height:16px; color:var(--onSurfaceVariant); margin-top:8px; }
.hl { background:var(--highlight-bg); color:var(--primary); font-weight:700; border-radius:2px; padding:0 1px; }
</style>
</head>
<body>
<div class="status-bar">9:41</div>
<div class="top-bar">
  <div class="search-bar" role="search" aria-label="搜索笔记">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="search" value="Compose" aria-label="搜索笔记">
    <button class="clear-btn" aria-label="清除搜索内容"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>
</div>
<div class="result-count">找到 2 条结果</div>
<div class="content">
  <div class="card">
    <div class="card-title">学习笔记：Jetpack <span class="hl">Compose</span></div>
    <div class="card-summary">StateFlow vs LiveData 的对比分析，<span class="hl">Compose</span> UI 架构最佳实践…</div>
    <div class="card-time">昨天 09:12</div>
  </div>
  <div class="card">
    <div class="card-title">项目架构决策</div>
    <div class="card-summary">MVVM + <span class="hl">Compose</span> + Hilt + Room，所有协程绑定 viewModelScope…</div>
    <div class="card-time">06/02</div>
  </div>
</div>
</body>
</html>
