<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>P1 笔记列表 — 多选模式</title>
<style>
:root {
  --primary: #1A4FBF; --onPrimary: #FFFFFF; --primaryContainer: #DAE2FF; --onPrimaryContainer: #001849;
  --error: #B81C1C; --onError: #FFFFFF; --errorContainer: #FFDAD6;
  --surface: #FEFBFF; --onSurface: #1C1B1E; --surfaceVariant: #E7E0EC; --onSurfaceVariant: #49454F;
  --outline: #79747E; --outlineVariant: #CAC4D0;
  --background: #FEFBFF; --onBackground: #1C1B1E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #B0C6FF; --onPrimary: #001D36; --primaryContainer: #0040A5; --onPrimaryContainer: #DAE2FF;
    --error: #FFB4AB; --onError: #690005; --errorContainer: #93000A;
    --surface: #1C1B1F; --onSurface: #E6E1E5; --surfaceVariant: #49454F; --onSurfaceVariant: #CAC4D0;
    --outline: #938F99; --outlineVariant: #49454F;
    --background: #1C1B1F; --onBackground: #E6E1E5;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; margin:0 auto; font-family:Roboto,'Noto Sans SC',sans-serif; background:var(--background); color:var(--onSurface); min-height:812px; }
.status-bar { height:44px; display:flex; align-items:center; justify-content:flex-end; padding:0 16px; font-size:14px; font-weight:600; }
.multi-top-bar { height:64px; display:flex; align-items:center; padding:0 8px 0 16px; background:var(--surface); gap:16px; }
.close-btn { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; cursor:pointer; color:var(--onSurface); border-radius:20px; }
.close-btn svg { width:24px; height:24px; }
.multi-title { flex:1; font-size:18px; font-weight:500; }
.select-all-btn { padding:8px 12px; border:none; background:transparent; color:var(--primary); font-size:14px; font-weight:500; cursor:pointer; border-radius:8px; }
.content { padding:0 16px 96px; margin-top:8px; }
.card { border-radius:12px; background:var(--surface); border:1px solid var(--outlineVariant); padding:12px 16px 12px 12px; margin-bottom:12px; cursor:pointer; display:flex; align-items:flex-start; gap:12px; transition:background 0.15s; }
.card.selected { background:var(--primaryContainer); border-color:var(--primary); }
.checkbox { width:24px; height:24px; border-radius:4px; border:2px solid var(--outline); flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; }
.card.selected .checkbox { background:var(--primary); border-color:var(--primary); }
.checkbox svg { width:16px; height:16px; color:var(--onPrimary); display:none; }
.card.selected .checkbox svg { display:block; }
.card-body { flex:1; min-width:0; }
.card-title { font-size:16px; font-weight:500; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-summary { font-size:14px; line-height:20px; color:var(--onSurfaceVariant); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-time { font-size:11px; line-height:16px; color:var(--onSurfaceVariant); margin-top:8px; }
.bottom-bar { position:fixed; bottom:0; left:0; right:0; max-width:375px; margin:0 auto; height:64px; background:var(--surface); border-top:1px solid var(--outlineVariant); display:flex; align-items:center; padding:0 16px; }
.delete-btn { padding:10px 24px; border-radius:20px; background:var(--error); color:var(--onError); border:none; font-size:14px; font-weight:500; cursor:pointer; margin-left:auto; }
.delete-btn:disabled { opacity:0.38; cursor:default; }
</style>
</head>
<body>
<div class="status-bar">9:41</div>
<div class="multi-top-bar">
  <button class="close-btn" aria-label="退出多选模式"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <span class="multi-title">已选 2 项</span>
  <button class="select-all-btn">全选</button>
</div>
<div class="content">
  <div class="card selected">
    <div class="checkbox"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    <div class="card-body">
      <div class="card-title">会议纪要 — 2026-06-01</div>
      <div class="card-summary">讨论了Q2产品路线图，确定了搜索功能的优先级…</div>
      <div class="card-time">今天 14:35</div>
    </div>
  </div>
  <div class="card">
    <div class="checkbox"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    <div class="card-body">
      <div class="card-title">学习笔记：Jetpack Compose</div>
      <div class="card-summary">StateFlow vs LiveData 的对比分析…</div>
      <div class="card-time">昨天 09:12</div>
    </div>
  </div>
  <div class="card selected">
    <div class="checkbox"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    <div class="card-body">
      <div class="card-title">待办事项</div>
      <div class="card-summary">1. Room 数据库调研 2. M3 主题适配 3. 无障碍测试…</div>
      <div class="card-time">周二 16:00</div>
    </div>
  </div>
  <div class="card">
    <div class="checkbox"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    <div class="card-body">
      <div class="card-title">项目架构决策</div>
      <div class="card-summary">MVVM + Compose + Hilt + Room，所有协程绑定 viewModelScope…</div>
      <div class="card-time">06/02</div>
    </div>
  </div>
</div>
<div class="bottom-bar">
  <button class="delete-btn">删除选中(2)</button>
</div>
</body>
</html>
