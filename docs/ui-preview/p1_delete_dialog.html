<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记列表 - 删除确认</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 375px; margin: 0 auto;
  font-family: 'Roboto', system-ui, -apple-system, sans-serif;
  background: #FFFBFE; color: #1C1B1E;
}
.header {
  height: 64px; background: #FFFBFE;
  display: flex; align-items: center; padding: 0 16px;
  justify-content: space-between;
  border-bottom: 1px solid #CAC4D0;
}
.header-title { font-size: 22px; font-weight: 400; }
.header-search {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; cursor: pointer;
}
.header-search svg { width: 24px; height: 24px; fill: #49454F; }
.content { padding: 16px; }
.card {
  background: #FFFBFE; border-radius: 12px;
  border: 1px solid #CAC4D0; padding: 16px;
  margin-bottom: 12px;
}
.card-title { font-size: 16px; font-weight: 500; line-height: 24px; margin-bottom: 4px; }
.card-preview { font-size: 14px; color: #49454F; line-height: 20px; margin-bottom: 8px; }
.card-time { font-size: 11px; color: #49454F; line-height: 16px; text-align: right; }

/* Swipe-to-dismiss card */
.swipe-card {
  position: relative; border-radius: 12px; margin-bottom: 12px; overflow: hidden;
}
.swipe-bg {
  position: absolute; right: 0; top: 0; bottom: 0; width: 88px;
  background: #B3261E; border-radius: 0 12px 12px 0;
  display: flex; align-items: center; justify-content: center;
}
.swipe-bg svg { width: 24px; height: 24px; fill: #FFFFFF; }
.swipe-bg span { color: #FFF; font-size: 12px; }
.swipe-content {
  background: #FFFBFE; border-radius: 12px;
  border: 1px solid #CAC4D0; padding: 16px;
  transform: translateX(-88px); transition: transform 0.2s;
}
.swipe-content .card-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swipe-content .card-preview { font-size: 14px; color: #49454F; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swipe-content .card-time { font-size: 11px; color: #49454F; text-align: right; }

/* Dialog overlay */
.overlay {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 375px; height: 100vh;
  background: rgba(0,0,0,0.32); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.dialog {
  background: #FFFBFE; border-radius: 28px;
  padding: 24px; width: 312px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.dialog-title { font-size: 24px; font-weight: 400; margin-bottom: 16px; }
.dialog-text { font-size: 14px; color: #49454F; line-height: 20px; margin-bottom: 24px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn-text {
  padding: 10px 12px; border: none; border-radius: 20px;
  background: transparent; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}
.btn-text.cancel { color: #6750A4; }
.btn-text.cancel:hover { background: rgba(103,80,164,0.08); }
.btn-text.danger { color: #B3261E; }
.btn-text.danger:hover { background: rgba(179,38,30,0.08); }

.fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 56px; height: 56px; border-radius: 16px;
  background: #EADDFF; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.14);
}
.fab svg { width: 24px; height: 24px; fill: #21005D; }
</style>
</head>
<body>
<div class="header">
  <span class="header-title">记事本</span>
  <span class="header-search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </span>
</div>
<div class="content">
  <div class="swipe-card">
    <div class="swipe-bg">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </div>
    <div class="swipe-content">
      <div class="card-title">会议纪要 — 2026-06-01</div>
      <div class="card-preview">讨论了Q2产品路线图，确定了关键里程碑</div>
      <div class="card-time">今天 14:35</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">学习笔记：Jetpack Compose</div>
    <div class="card-preview">StateFlow vs LiveData 的对比分析</div>
    <div class="card-time">昨天 09:12</div>
  </div>
</div>

<div class="overlay">
  <div class="dialog">
    <div class="dialog-title">确定删除这条笔记？</div>
    <div class="dialog-text">删除后可以撤销</div>
    <div class="dialog-actions">
      <button class="btn-text cancel">取消</button>
      <button class="btn-text danger">删除</button>
    </div>
  </div>
</div>

<div class="fab">
  <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
</div>
</body>
</html>
